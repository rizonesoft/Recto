# Independent reviewers for this repository, read by scripts/review-dispatch.py.
#
# Owner decision 2026-10-23: Opus 5.5 (Claude Code, writer `claude`) is the only
# writer in this repository, and GPT-6.1 Sol through the Codex CLI is the only
# reviewer. One route, one reviewer, no fallback. A reviewer that is not
# installed, fails, times out, returns nothing or replies OVERALL: blocked is
# recorded with its reason: there is no review, never an approval.
#
# Loaded strictly: an unknown key, an unknown CLI, a malformed model, a route
# naming an undefined reviewer, a second reviewer in a route, or a reviewer of
# the writer's own model family refuses every dispatch.

schema_version = 1

# GPT-6.1 Sol through the Codex CLI at xhigh, the highest effort Codex accepts, read-only sandbox (owner decision
# 2026-10-22, replacing GPT-6 Astra at medium; sole reviewer since 2026-10-23).
[reviewers.sol]
cli = "codex"
model = "gpt-6.1-sol"
effort = "xhigh"

[routes]
claude = ["sol"]
