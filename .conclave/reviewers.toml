# Independent reviewers for this repository, read by scripts/review-dispatch.py.
#
# Owner decision 2026-10-23: Opus 5.5 (Claude Code, writer `claude`) is the only
# writer in this repository. Owner decision 2026-10-28 (later the same day):
# the Astra and Terra panel was more review than the work needed, so the route
# is GPT-6 Astra alone through the Codex CLI, each of its passes one effort
# level higher than before the panel (the panel's record is
# docs/experiments/2026-10-27-reviewer-ab.md). There is no fallback: a reviewer
# that is not installed, fails, times out, returns nothing or replies OVERALL:
# blocked is recorded with its reason, and is no review, never an approval.
#
# Loaded strictly: an unknown key, an unknown CLI, a malformed model, a route
# naming an undefined reviewer or one twice, more than 4 reviewers, or a
# reviewer of the writer's own model family refuses every dispatch. The
# schedule is loaded as strictly: an unknown lens, or an effort a reviewer's
# CLI does not take, refuses too.

schema_version = 1

# GPT-6 Astra through the Codex CLI, read-only sandbox (owner decision 2026-10-23, replacing GPT-6.1 Sol). The
# effort here is the default for a pass the schedule does not cover; [schedule] sets each pass's own effort.
[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "high"

[routes]
claude = ["astra"]

# The review schedule (owner decision 2026-10-23; every effort raised one level 2026-10-28). The dispatcher picks each
# pass's effort and lenses, so the loop runs the same way every time: a plan review before the build, the completion
# review after it, three fixed adversarial rounds at falling effort, then one medium-effort lens per round in
# rotation until the loop stops. The first round with no P1 or P2 finding (its worst P3, or none) ends the loop
# (owner decision 2026-10-24: was from round 4 on; severity_stop_after = 0 opens the stop from round 1); a rotation
# round that finds a P1 is followed by one high-effort adversarial round. The cap stays 33 rounds.
[schedule]
severity_stop_after = 0

[schedule.plan]
effort = "high"
lenses = ["plan"]

[schedule.completion]
effort = "high"

[[schedule.rounds]]
effort = "xhigh"
lenses = ["adversarial", "integration", "source-defect", "plan-delivery"]

[[schedule.rounds]]
effort = "high"
lenses = ["adversarial"]

[[schedule.rounds]]
effort = "medium"
lenses = ["adversarial"]

[schedule.rotation]
effort = "medium"
lenses = ["consistency", "quality", "design", "optimization", "record"]

[schedule.escalation]
effort = "high"
lenses = ["adversarial"]
