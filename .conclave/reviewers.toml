# Independent reviewers for Recto, read by scripts/review_pin.py for
# scripts/review-dispatch.py and scripts/todo-graph.py stamp.
#
# Owner decisions 2026-10-28, 2026-11-10 and 2026-11-13: GPT-6 Astra through the
# Codex CLI in its read-only sandbox reviews all work written by Claude Code
# (`claude`) and Google Antigravity (`agy` / `gemini`), with no fallback.
# Earlier stamps (panel era 2026-10-28 and rotation era through 2026-11-12)
# replay against the pin committed at their plan or stamp commit.

schema_version = 1

[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "high"

[routes]
claude = ["astra"]
agy = ["astra"]

# Three-pass review policy (imported from Conclave-SDK kits/reviewer):
#   1. Plan review (--kind plan) before the build;
#   2. One round (--kind round --candidate <SHA>) across every defect lens;
#   3. Completion and excellence review (--kind completion --candidate <SHA>);
#   4. Reconciliation (--kind reconciliation) only when completion returns
#      blocking gaps (P1 or P2), up to pass_cap returned passes in all.
[schedule]
policy = "three-pass"
pass_cap = 33
blocking = ["P1", "P2"]

[schedule.plan]
effort = "medium"
lenses = ["plan"]

# `design` runs only when `--surface` is passed (Surface: yes sections).
[[schedule.rounds]]
effort = "medium"
lenses = ["adversarial", "integration", "source-defect", "consistency", "quality", "optimization", "design"]

[schedule.completion]
effort = "medium"
lenses = ["plan-delivery", "record"]

[schedule.reconciliation]
effort = "medium"
lenses = ["adversarial", "integration", "plan-delivery", "record"]
