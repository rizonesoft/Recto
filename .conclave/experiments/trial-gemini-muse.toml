# Trial of two further reviewers on the D01 T02 §33 round 1 candidate (owner request 2026-10-28):
# Gemini 4 Argon at medium through Antigravity and Muse Wonder 1.0 at high through Meta Muse.
schema_version = 1

[reviewers.gemini]
cli = "agy"
model = "gemini-4-argon"
effort = "medium"

[reviewers.muse]
cli = "muse"
model = "muse-wonder-1.0"
effort = "high"

[routes]
claude = ["gemini", "muse"]

[schedule]
severity_stop_after = 0
plan = { effort = "medium", lenses = ["plan"] }
completion = { effort = "medium" }
rounds = [{ effort = "medium", lenses = ["adversarial", "integration", "source-defect", "plan-delivery"] },
          { effort = "medium", lenses = ["adversarial"] }, { effort = "medium", lenses = ["adversarial"] }]
rotation = { effort = "medium", lenses = ["consistency", "quality", "design", "optimization", "record"] }
escalation = { effort = "medium", lenses = ["adversarial"] }

[schedule.efforts.muse]
plan = "high"
completion = "high"
rounds = ["high", "high", "high"]
rotation = "high"
escalation = "high"
