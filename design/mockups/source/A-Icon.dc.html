<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recto A: App icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.lbl{font-size:12px;font-weight:600;color:#5C5C5C;letter-spacing:.3px}
.sz{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;font-size:11px}
</style>
</helmet>
<div style="width:1280px;height:900px;box-sizing:border-box;padding:48px;background:#F4F5F8;font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:#1B1B1B;display:grid;grid-template-columns:440px minmax(0,1fr);gap:48px">
  <div style="display:flex;flex-direction:column;gap:14px">
    <span class="lbl">MASTER, 256 PX GRID WITH KEYLINES</span>
    <div style="width:440px;height:440px;background:#FFFFFF;border:1px solid #E3E3E6;border-radius:12px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden">
      <svg viewBox="0 0 64 64" width="440" height="440" aria-hidden="true" style="position:absolute;left:0;top:0"><g stroke="#E4E8F2" stroke-width=".15" fill="none"><path d="M8 0V64M16 0V64M24 0V64M32 0V64M40 0V64M48 0V64M56 0V64M0 8H64M0 16H64M0 24H64M0 32H64M0 40H64M0 48H64M0 56H64"></path><rect x="4" y="4" width="56" height="56" stroke="#F0A8A8" stroke-width=".25"></rect><circle cx="32" cy="32" r="28" stroke="#F0A8A8" stroke-width=".25"></circle></g></svg>
      <svg viewBox="0 0 64 64" width="380" height="380" role="img" aria-label="Recto icon, version A" style="position:relative"><path d="M6 16 L29 11 V55 L6 59 Z" fill="#C9D7F8"></path><path d="M11 24 L24 21.5 M11 31 L24 28.5 M11 38 L24 35.5" stroke="#8EABEF" stroke-width="3" stroke-linecap="round"></path><path d="M33 11 H49 L58 20 V55 H33 Z" fill="#2459D6"></path><path d="M49 11 V20 H58 Z" fill="#9DB8F2"></path><rect x="38" y="29" width="15" height="3" rx="1.5" fill="#FFFFFF"></rect><rect x="38" y="36" width="15" height="3" rx="1.5" fill="#FFFFFF" opacity=".75"></rect><rect x="38" y="43" width="10" height="3" rx="1.5" fill="#FFFFFF" opacity=".75"></rect></svg>
    </div>
    <div style="display:flex;gap:12px;align-items:center;font-size:12px;color:#3B3B3B">
      <span style="width:16px;height:16px;border-radius:3px;background:#2459D6;display:block"></span>#2459D6
      <span style="width:16px;height:16px;border-radius:3px;background:#9DB8F2;display:block"></span>#9DB8F2
      <span style="width:16px;height:16px;border-radius:3px;background:#C9D7F8;display:block"></span>#C9D7F8
      <span style="width:16px;height:16px;border-radius:3px;background:#8EABEF;display:block"></span>#8EABEF
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:28px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <span class="lbl">SIZES, LIGHT AND DARK</span>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
        <div style="background:#FFFFFF;border:1px solid #E3E3E6;border-radius:10px;padding:20px;display:flex;align-items:flex-end;gap:22px;height:132px;box-sizing:border-box">
          <sc-for list="{{sizes}}" as="s" hint-placeholder-count="5"><div class="sz" style="color:#5C5C5C"><svg viewBox="0 0 64 64" width="{{s.px}}" height="{{s.px}}" aria-hidden="true"><path d="M6 16 L29 11 V55 L6 59 Z" fill="#C9D7F8"></path><path d="M33 11 H49 L58 20 V55 H33 Z" fill="#2459D6"></path><path d="M49 11 V20 H58 Z" fill="#9DB8F2"></path><rect x="38" y="29" width="15" height="3" rx="1.5" fill="#FFFFFF" opacity="{{s.lines}}"></rect><rect x="38" y="36" width="15" height="3" rx="1.5" fill="#FFFFFF" opacity="{{s.lines}}"></rect></svg>{{s.label}}</div></sc-for>
        </div>
        <div style="background:#202020;border-radius:10px;padding:20px;display:flex;align-items:flex-end;gap:22px;height:132px;box-sizing:border-box">
          <sc-for list="{{sizes}}" as="s" hint-placeholder-count="5"><div class="sz" style="color:#BDBDBD"><svg viewBox="0 0 64 64" width="{{s.px}}" height="{{s.px}}" aria-hidden="true"><path d="M6 16 L29 11 V55 L6 59 Z" fill="#5E7FC9"></path><path d="M33 11 H49 L58 20 V55 H33 Z" fill="#4F7FEA"></path><path d="M49 11 V20 H58 Z" fill="#C7D8FF"></path><rect x="38" y="29" width="15" height="3" rx="1.5" fill="#FFFFFF" opacity="{{s.lines}}"></rect><rect x="38" y="36" width="15" height="3" rx="1.5" fill="#FFFFFF" opacity="{{s.lines}}"></rect></svg>{{s.label}}</div></sc-for>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <span class="lbl">TASKBAR</span>
      <div style="height:56px;border-radius:10px;background:#E8EBF2;display:flex;align-items:center;justify-content:center;gap:6px">
        <span style="width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center"><span style="width:24px;height:24px;border-radius:5px;background:#B9C0CC;display:block"></span></span>
        <span style="width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center"><span style="width:24px;height:24px;border-radius:5px;background:#B9C0CC;display:block"></span></span>
        <span style="width:40px;height:40px;border-radius:6px;background:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px"><svg viewBox="0 0 64 64" width="24" height="24" aria-hidden="true"><path d="M6 16 L29 11 V55 L6 59 Z" fill="#C9D7F8"></path><path d="M33 11 H49 L58 20 V55 H33 Z" fill="#2459D6"></path><path d="M49 11 V20 H58 Z" fill="#9DB8F2"></path></svg><span style="width:16px;height:3px;border-radius:2px;background:#2459D6;display:block"></span></span>
        <span style="width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center"><span style="width:24px;height:24px;border-radius:5px;background:#B9C0CC;display:block"></span></span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:150px 310px minmax(0,1fr);gap:20px;align-items:end">
      <div style="display:flex;flex-direction:column;gap:12px"><span class="lbl">STORE TILE</span>
        <div style="width:150px;height:150px;border-radius:8px;background:#2459D6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#FFFFFF"><svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true"><path d="M6 16 L29 11 V55 L6 59 Z" fill="#7FA0EC"></path><path d="M33 11 H49 L58 20 V55 H33 Z" fill="#FFFFFF"></path><path d="M49 11 V20 H58 Z" fill="#C9D7F8"></path><rect x="38" y="29" width="15" height="3" rx="1.5" fill="#2459D6"></rect><rect x="38" y="36" width="15" height="3" rx="1.5" fill="#2459D6" opacity=".6"></rect></svg><span style="font-size:14px;font-weight:600">Recto</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px"><span class="lbl">WIDE TILE</span>
        <div style="width:310px;height:150px;border-radius:8px;background:#2459D6;display:flex;align-items:center;gap:18px;padding:0 28px;box-sizing:border-box;color:#FFFFFF"><svg viewBox="0 0 64 64" width="80" height="80" aria-hidden="true"><path d="M6 16 L29 11 V55 L6 59 Z" fill="#7FA0EC"></path><path d="M33 11 H49 L58 20 V55 H33 Z" fill="#FFFFFF"></path><path d="M49 11 V20 H58 Z" fill="#C9D7F8"></path><rect x="38" y="29" width="15" height="3" rx="1.5" fill="#2459D6"></rect><rect x="38" y="36" width="15" height="3" rx="1.5" fill="#2459D6" opacity=".6"></rect></svg><span style="font-family:'Segoe UI Variable Display','Segoe UI',sans-serif;font-size:34px;font-weight:600">Recto</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px"><span class="lbl">PDF FILE ICON IN EXPLORER</span>
        <div style="height:150px;border-radius:8px;background:#FFFFFF;border:1px solid #E3E3E6;display:flex;align-items:center;justify-content:center;gap:28px">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px"><svg viewBox="0 0 48 64" width="72" height="96" aria-hidden="true"><path d="M4 2 H32 L46 16 V62 H4 Z" fill="#FFFFFF" stroke="#C4C4C4" stroke-width="1.5"></path><path d="M32 2 V16 H46" fill="#EDEDED" stroke="#C4C4C4" stroke-width="1.5"></path><g transform="translate(10 26) scale(.44)"><path d="M6 16 L29 11 V55 L6 59 Z" fill="#C9D7F8"></path><path d="M33 11 H49 L58 20 V55 H33 Z" fill="#2459D6"></path><path d="M49 11 V20 H58 Z" fill="#9DB8F2"></path></g><rect x="4" y="50" width="20" height="10" fill="#2459D6"></rect><text x="7" y="58" font-size="7" font-weight="700" fill="#FFFFFF" font-family="Segoe UI, sans-serif">PDF</text></svg>Lease agreement 2026.pdf</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const sizes=[{px:64,label:"64",lines:"1"},{px:48,label:"48",lines:"1"},{px:32,label:"32",lines:"1"},{px:24,label:"24",lines:"0"},{px:16,label:"16",lines:"0"}];
return {sizes};
}
}
</script>
</body>
</html>
