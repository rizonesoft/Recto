.wc{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#EDEAE4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:6px;border:1px solid #4A4642;background:#2E2C2A;font:inherit;font-size:13px;color:#EDEAE4;white-space:nowrap;text-decoration:none}
.btn.p{background:#F0603C;border-color:#F0603C;color:#1B1A19;font-weight:600}
.cap{font-size:12px;color:#B8B2A8}
.tool{display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;border-radius:8px;text-decoration:none;color:#EDEAE4;font-size:14px}

            </span>

      <div style="display:flex;align-items:center;gap:12px;margin-top:20px">
        <h2 class="serif" style="margin:0;font-size:24px;font-weight:500;flex-grow:1">Recent files</h2>
        <label style="display:flex;align-items:center;gap:8px;width:260px;height:34px;padding:0 10px;box-sizing:border-box;border-radius:6px;background:#2A2826;border:1px solid #3A3734;color:#B8B2A8"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.search}}"></path></svg><input aria-label="Filter recent files" placeholder="Filter" style="border:0;outline:0;background:transparent;color:#EDEAE4;font:inherit;font-size:13px;flex-grow:1"></label>
      </div>
      <div>
        <div class="rr cap" style="border-top:0;font-weight:600"><span>Name</span><span>Folder</span><span>Pages</span><span>Opened</span></div>

        </sc-for>
      </div>
    </div>
  </div>
</div>
