.cmd{display:flex;align-items:center;gap:8px;width:340px;height:30px;padding:0 6px 0 10px;border-radius:4px;border:1px solid #D6D9DF;background:#FFFFFF;font:inherit;font-size:12px;color:#5C5C5C;box-sizing:border-box}
.seg{display:flex;padding:2px;background:#D6D9DF;border-radius:4px;gap:2px;flex:none}
.seg button{height:30px;padding:0 16px;border:0;border-radius:4px;background:transparent;font:inherit;font-size:13px;color:#5C5C5C}
.seg button.on{background:#FFFFFF;color:#1B1B1B;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.btn .ic{color:#5C5C5C}
.btn.p{background:#C8431F;border-color:#C8431F;color:#FFFFFF;font-weight:600}
.cb{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:4px;border:0;background:transparent;font:inherit;font-size:13px;color:#1B1B1B;white-space:nowrap;flex:none}
.cb .ic{color:#5C5C5C}
.sep{width:1px;height:24px;background:#D6D9DF;margin:0 6px;flex:none}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;border:0;background:transparent;font:inherit;padding:10px 0 6px;border-radius:8px;height:196px;box-sizing:border-box}

.ab{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:0;border-radius:4px;background:transparent;color:#EDEAE4;font:inherit;font-size:13px;white-space:nowrap}
</style>
