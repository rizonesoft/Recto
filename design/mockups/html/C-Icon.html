      <span style="width:16px;height:16px;border-radius:4px;background:#6C61F0;display:block"></span>#6C61F0 dark

  </div>

        <span style="width:40px;height:40px;display:flex;align-items:center;justify-content:center"><span style="width:24px;height:24px;border-radius:6px;background:#C3C1D3;display:block"></span></span>
        <span style="width:40px;height:40px;display:flex;align-items:center;justify-content:center"><span style="width:24px;height:24px;border-radius:6px;background:#C3C1D3;display:block"></span></span>

          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px"><svg viewBox="0 0 48 64" width="72" height="96" aria-hidden="true"><path d="M4 6 Q4 2 8 2 H32 L46 16 V58 Q46 62 42 62 H8 Q4 62 4 58 Z" fill="#FFFFFF" stroke="#D9D7E6" stroke-width="1.5"></path><path d="M32 2 V12 Q32 16 36 16 H46" fill="#EFEDFF" stroke="#D9D7E6" stroke-width="1.5"></path><g transform="translate(11 22) scale(.4)"><rect x="2" y="2" width="60" height="60" rx="16" fill="#5B4FE0"></rect><path fill-rule="evenodd" fill="#FFFFFF" d="M18 14 H35 A11 11 0 0 1 35 36 H27 V50 H18 Z M27 22 V28 H34 A3 3 0 0 0 34 22 Z"></path></g><text x="24" y="56" text-anchor="middle" font-size="7" font-weight="700" fill="#4A3FD0" font-family="Segoe UI, sans-serif">PDF</text></svg>Lease agreement 2026.pdf</div>
        </div>
