<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recto B: GitHub social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
.chip{font-size:15px;padding:7px 14px;border-radius:16px;border:1px solid #4A4642;color:#D3CFC7}
.bar{height:5px;border-radius:3px;background:#CFCBC3;display:block}
</style>
</head>
<body>
<div style="width:1280px;height:640px;position:relative;overflow:hidden;background:#1B1A19;font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:#EDEAE4">
  <div aria-hidden="true" style="position:absolute;left:80px;top:0;width:36px;height:120px;background:#F0603C;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)"></div>
  <div style="position:absolute;left:80px;top:160px;width:560px;display:flex;flex-direction:column;gap:20px">
    <div style="font-family:'Newsreader',Georgia,serif;font-size:96px;font-weight:500;line-height:92px;letter-spacing:-1.5px">Recto</div>
    <div style="font-family:'Newsreader',Georgia,serif;font-size:36px;line-height:44px">Read, convert and organize PDFs on Windows.</div>
    <div style="font-size:19px;line-height:28px;color:#B8B2A8">Free and open source. Built in C++ on WinUI 3 and MuPDF.</div>
    <div style="display:flex;gap:8px"><span class="chip">PDF to Word</span><span class="chip">Merge and split</span><span class="chip">Office to PDF</span></div>
    <div style="font-size:17px;color:#F48A6E;margin-top:8px">github.com/[OWNER]/recto</div>
  </div>
  <div aria-hidden="true" style="position:absolute;left:700px;top:96px;width:680px;height:600px;background:#1F1E1C;border-radius:12px;border:1px solid #3A3734;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column">
    <div style="height:34px;background:#1B1A19;display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid #2E2C2A"><span style="width:44px;height:8px;border-radius:4px;background:#5A5550;display:block"></span><span style="width:36px;height:8px;border-radius:4px;background:#EDEAE4;display:block;box-shadow:0 13px 0 -2px #F0603C"></span><span style="width:44px;height:8px;border-radius:4px;background:#5A5550;display:block"></span></div>
    <div style="display:flex;flex-grow:1">
      <div style="flex-grow:1;background:#141312;display:flex;justify-content:center;padding-top:26px"><div style="width:360px;height:470px;background:#FFFFFF;padding:36px;box-sizing:border-box;display:flex;flex-direction:column;gap:9px"><span class="bar" style="width:60%;height:12px;background:#1F1D1B"></span><span style="height:6px"></span><span class="bar" style="width:100%"></span><span class="bar" style="width:94%"></span><span class="bar" style="width:97%"></span><span class="bar" style="width:62%"></span><span style="height:6px"></span><span class="bar" style="width:100%"></span><span class="bar" style="width:90%"></span><span class="bar" style="width:80%;background:#FFD8A8;height:9px"></span><span class="bar" style="width:96%"></span></div></div>
      <div style="width:170px;background:#232120;border-left:1px solid #34312E;padding:18px 14px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px"><span class="bar" style="width:70%;background:#5A5550"></span><span class="bar" style="width:100%;background:#3A3734;height:22px;border-radius:5px;box-shadow:inset 0 0 0 1.5px #F0603C"></span><span class="bar" style="width:90%;background:#5A5550"></span><span class="bar" style="width:80%;background:#5A5550"></span><span class="bar" style="width:86%;background:#5A5550"></span></div>
    </div>
  </div>
</div>
</body>
</html>
