<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recto B: GitHub README banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
.chip{font-size:14px;padding:6px 12px;border-radius:14px;border:1px solid #4A4642;color:#D3CFC7}
.ln{height:6px;border-radius:3px;background:#CFCBC3;display:block}
</style>
</head>
<body>
<div style="width:1280px;height:320px;position:relative;overflow:hidden;background:#1B1A19;font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;color:#EDEAE4">
  <div aria-hidden="true" style="position:absolute;left:72px;top:0;width:34px;height:112px;background:#F0603C;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)"></div>
  <div style="position:absolute;left:140px;top:44px;display:flex;flex-direction:column;gap:6px">
    <div style="font-family:'Newsreader',Georgia,serif;font-size:120px;font-weight:500;line-height:120px;letter-spacing:-2px">Recto</div>
    <div style="font-family:'Newsreader',Georgia,serif;font-size:26px;font-style:italic;color:#D3CFC7">the right-hand page</div>
    <div style="font-size:18px;color:#B8B2A8;margin-top:8px">Open-source PDF viewer and converter for Windows</div>
    <div style="display:flex;gap:8px;margin-top:12px"><span class="chip">WinUI 3</span><span class="chip">C++20</span><span class="chip">recto-pdf</span><span class="chip">GPL-3.0</span></div>
  </div>
  <div aria-hidden="true" style="position:absolute;right:100px;top:40px;width:260px;height:340px;background:#F5F4F0;transform:rotate(6deg);box-shadow:0 20px 50px rgba(0,0,0,.6);padding:56px 34px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
    <span class="ln" style="width:60%;height:10px;background:#3A3734"></span><span style="height:6px"></span><span class="ln" style="width:100%"></span><span class="ln" style="width:92%"></span><span class="ln" style="width:96%"></span><span class="ln" style="width:70%"></span><span style="height:6px"></span><span class="ln" style="width:100%"></span><span class="ln" style="width:86%"></span>
    <span style="position:absolute;right:46px;top:-14px;width:30px;height:120px;background:#F0603C;clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);display:block"></span>
  </div>
</div>
</body>
</html>
