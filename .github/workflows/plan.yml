name: plan-gates

# The TODO graph is the execution plan: a malformed graph or a stale
# generated plan fails CI like any other defect. The app build workflow
# arrives with the M0 scaffold (D00 T01 §4) and does not replace this one.

on:
  push:
    branches: [main]
    paths:
      - 'docs/user-demand.md'
      - 'docs/acrobat-parity.md'
      - 'docs/plans/**'
      - 'docs/scope.md'
      - 'docs/support/**'
      - 'docs/unattended-prompt.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'todo/**'
      - 'docs/reviews/**'
      - 'scripts/**'
      - 'tests/scripts/**'
      - 'src/pdf/error.h'
      - '.conclave/**'
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '.claude/settings.json'
      - '.agents/**'
      - '.lsp.json'
      - '.mcp.json'
      - 'pyrightconfig.json'
      - '.clangd'
      - '.gitattributes'
      # Any workflow change, so a Dependabot action update gets plan-gates like every other pull request.
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - 'docs/user-demand.md'
      - 'docs/acrobat-parity.md'
      - 'docs/plans/**'
      - 'docs/scope.md'
      - 'docs/support/**'
      - 'docs/unattended-prompt.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'todo/**'
      - 'docs/reviews/**'
      - 'scripts/**'
      - 'tests/scripts/**'
      - 'src/pdf/error.h'
      - '.conclave/**'
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '.claude/settings.json'
      - '.agents/**'
      - '.lsp.json'
      - '.mcp.json'
      - 'pyrightconfig.json'
      - '.clangd'
      - '.gitattributes'
      # Any workflow change, so a Dependabot action update gets plan-gates like every other pull request.
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

jobs:
  plan-gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Stamp ancestry checks need real history, not a shallow checkout.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Validate the TODO tree
        shell: pwsh
        run: python scripts/todo-graph.py validate
      - name: Check generated implementation plan is current
        shell: pwsh
        run: python scripts/todo-graph.py plan --check
      - name: Check reviewer pin and historical receipts
        shell: pwsh
        run: python scripts/review_pin.py --check --all
      - name: Run campaign guard self-test
        shell: pwsh
        run: python scripts/campaign_guard.py --self-test
      - name: Verify Claude agent model tiers
        shell: pwsh
        run: node scripts/verify-agent-tiers.mjs
      - name: Generate portable clangd compilation database
        shell: pwsh
        run: python scripts/gen-compile-commands.py
      - name: Verify portable clangd compilation database round-trips
        shell: pwsh
        run: python scripts/gen-compile-commands.py --check
      - name: Check the user demand ledger (D07 T03 §6)
        shell: pwsh
        run: python scripts/check-user-demand.py
      - name: Run full Recto and Conclave kit Python test suites in parallel
        shell: pwsh
        run: python scripts/run-tests.py --full
