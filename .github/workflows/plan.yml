name: plan-gates

# The TODO graph is the execution plan: a malformed graph or a stale
# generated plan fails CI like any other defect. The app build workflow
# arrives with the M0 scaffold (D00 T01 §4) and does not replace this one.

on:
  push:
    branches: [main]
    paths:
      - 'docs/user-demand.md'
      - 'docs/acrobat-parity.md'
      - 'docs/plans/**'
      - 'docs/scope.md'
      - 'docs/support/**'
      - 'README.md'
      - 'todo/**'
      - 'docs/reviews/**'
      - 'scripts/**'
      - 'tests/scripts/**'
      - '.claude/skills/**'
      - '.gitattributes'
      # Any workflow change, so a Dependabot action update gets plan-gates like every other pull request.
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - 'docs/user-demand.md'
      - 'docs/acrobat-parity.md'
      - 'docs/plans/**'
      - 'docs/scope.md'
      - 'docs/support/**'
      - 'README.md'
      - 'todo/**'
      - 'docs/reviews/**'
      - 'scripts/**'
      - 'tests/scripts/**'
      - '.claude/skills/**'
      - '.gitattributes'
      # Any workflow change, so a Dependabot action update gets plan-gates like every other pull request.
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

jobs:
  plan-gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Stamp ancestry checks need real history, not a shallow checkout.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Test the TODO graph tooling
        run: python -m unittest tests.scripts.test_todo_graph
      - name: Test the pre-commit hook that keeps the plan current
        run: python -m unittest tests.scripts.test_pre_commit_hook
      - name: Validate the TODO tree
        run: python scripts/todo-graph.py validate
      - name: Check the generated plan is current
        run: python scripts/todo-graph.py plan --check
      - name: Test the demand ledger checker
        run: python -m unittest tests.scripts.test_user_demand
      - name: Dependency merge automation tests
        run: python -m unittest tests.scripts.test_merge_prs
      - name: CI status watch tests
        run: python -m unittest tests.scripts.test_ci_status
      - name: Build driver checks
        run: python -m unittest tests.scripts.test_build_ps1
      - name: ETW registration guard
        run: python -m unittest tests.scripts.test_etw_registration
      - name: Recovery post-scan guard
        run: python -m unittest tests.scripts.test_recovery_post_scan
      - name: Mockup renderer and design checks
        run: python -m unittest tests.scripts.test_render_mockups tests.scripts.test_engine_dependency_policy
      - name: Check the user demand ledger (D07 T03 §6)
        run: python scripts/check-user-demand.py
